<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Ellenállás párosító – végleges</title>

<style>
    body {
        background: #111;
        color: #eee;
        font-family: Consolas, monospace;
        padding: 20px;
    }
    textarea {
        width: 100%;
        background: #222;
        color: #eee;
        border: 1px solid #444;
        padding: 10px;
    }
    button {
        background: #333;
        color: #eee;
        border: 1px solid #555;
        padding: 10px 20px;
        margin-right: 10px;
        cursor: pointer;
    }
    button:hover {
        background: #444;
    }
    pre {
        background: #000;
        padding: 15px;
        border: 1px solid #333;
        margin-top: 20px;
        white-space: pre-wrap;
    }
</style>

</head>
<body>

<h2>Ellenállás párosító – sötét mód</h2>

<textarea id="resInput" rows="4">
9998,10002,10010,9985,10005,9990,10020,10001,9975,10015
</textarea>

<br><br>

<button onclick="findSimplePair()">Soros pár keresése</button>
<button onclick="findParallelPairs()">Párhuzamos párok keresése</button>
<button onclick="findBoth()">Mindkettő (először párhuzamos, majd soros)</button>

<pre id="out"></pre>

<script>
function getResistors() {
    return document.getElementById("resInput").value
        .split(/[;, \n]+/)
        .filter(x => x.trim() !== "")
        .map(Number);
}

function rpar(a, b) {
    return 1 / (1/a + 1/b);
}

/* ---------------------------------------------------------
   1) SOROS PÁR
--------------------------------------------------------- */
function findSimplePair(list) {
    const resistors = list || getResistors();
    const out = document.getElementById("out");

    let best = null;
    let bestDelta = Infinity;

    for (let i = 0; i < resistors.length; i++) {
        for (let j = i + 1; j < resistors.length; j++) {
            const A = resistors[i];
            const B = resistors[j];
            const delta = Math.abs(A - B);

            if (delta < bestDelta) {
                bestDelta = delta;
                best = { A: A, B: B, i: i, j: j };
            }
        }
    }

    if (!list) {
        out.textContent =
            "SOROS PÁR:\n" +
            "  (" + best.i + ") " + best.A + " Ω\n" +
            "  (" + best.j + ") " + best.B + " Ω\n" +
            "  Δ = " + bestDelta + " Ω\n" +
            "  Átlag = " + ((best.A + best.B) / 2).toFixed(6) + " Ω\n";
    }

    return best;
}

/* ---------------------------------------------------------
   2) PÁRHUZAMOS PÁROK
--------------------------------------------------------- */
function findParallelPairs(list) {
    const resistors = list || getResistors();
    const out = document.getElementById("out");

    let best = null;
    let bestDelta = Infinity;

    for (let i = 0; i < resistors.length; i++) {
        for (let j = i + 1; j < resistors.length; j++) {
            for (let k = 0; k < resistors.length; k++) {
                if (k === i || k === j) continue;
                for (let l = k + 1; l < resistors.length; l++) {
                    if (l === i || l === j) continue;

                    const R = [
                        {v: resistors[i], idx: i},
                        {v: resistors[j], idx: j},
                        {v: resistors[k], idx: k},
                        {v: resistors[l], idx: l}
                    ];

                    const pairings = [
                        [[0,1],[2,3]],
                        [[0,2],[1,3]],
                        [[0,3],[1,2]]
                    ];

                    for (let p = 0; p < pairings.length; p++) {
                        const a1 = R[pairings[p][0][0]];
                        const b1 = R[pairings[p][0][1]];
                        const a2 = R[pairings[p][1][0]];
                        const b2 = R[pairings[p][1][1]];

                        const Rp1 = rpar(a1.v, b1.v);
                        const Rp2 = rpar(a2.v, b2.v);

                        const delta = Math.abs(Rp1 - Rp2);

                        if (delta < bestDelta) {
                            bestDelta = delta;
                            best = {
                                raw: [a1, b1, a2, b2],
                                Rp1: Rp1,
                                Rp2: Rp2
                            };
                        }
                    }
                }
            }
        }
    }

    if (!list) {
        out.textContent =
            "PÁRHUZAMOS PÁROK:\n" +
            "  Pár 1: (" + best.raw[0].idx + ") " + best.raw[0].v +
            " Ω || (" + best.raw[1].idx + ") " + best.raw[1].v +
            " Ω = " + best.Rp1.toFixed(6) + " Ω\n" +
            "  Pár 2: (" + best.raw[2].idx + ") " + best.raw[2].v +
            " Ω || (" + best.raw[3].idx + ") " + best.raw[3].v +
            " Ω = " + best.Rp2.toFixed(6) + " Ω\n" +
            "  Δ = " + bestDelta.toFixed(9) + " Ω\n";
    }

    return best;
}

/* ---------------------------------------------------------
   3) MINDKETTŐ – először párhuzamos, majd soros
--------------------------------------------------------- */
function findBoth() {
    const out = document.getElementById("out");
    const resistors = getResistors();

    const parallel = findParallelPairs(resistors);

    const used = new Set(parallel.raw.map(x => x.idx));
    const remaining = resistors.filter((_, idx) => !used.has(idx));

    const simple = findSimplePair(remaining);

    out.textContent =
        "VÉGSŐ EREDMÉNY:\n\n" +

        "PÁRHUZAMOS PANEL (4 ellenállás):\n" +
        "  Pár 1: (" + parallel.raw[0].idx + ") " + parallel.raw[0].v +
        " Ω || (" + parallel.raw[1].idx + ") " + parallel.raw[1].v +
        " Ω = " + parallel.Rp1.toFixed(6) + " Ω\n" +
        "  Pár 2: (" + parallel.raw[2].idx + ") " + parallel.raw[2].v +
        " Ω || (" + parallel.raw[3].idx + ") " + parallel.raw[3].v +
        " Ω = " + parallel.Rp2.toFixed(6) + " Ω\n\n" +

        "SOROS PANEL (maradékból):\n" +
        "  (" + simple.i + ") " + simple.A + " Ω\n" +
        "  (" + simple.j + ") " + simple.B + " Ω\n" +
        "  Δ = " + Math.abs(simple.A - simple.B) + " Ω\n";
}
</script>

</body>
</html>

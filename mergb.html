<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meRGB</title>
<style>
    body {
        background: #111;
        color: #eee;
        font-family: sans-serif;
        text-align: center;
    }
    canvas {
        background: #222;
        margin-top: 10px;
        cursor: pointer;
    }
    #gameover {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px;
    color: #ff6666;
    background: rgba(0,0,0,0.7);
    padding: 20px 30px;
    border-radius: 10px;
    display: none;
    z-index: 999;
    pointer-events: none;
}
    .menu button {
        margin: 5px;
        padding: 10px 20px;
        font-size: 16px;
        background: #333;
        color: #eee;
        border: 1px solid #555;
        cursor: pointer;
    }
    .menu button:hover {
        background: #444;
    }

    /* === REKORD POPUP === */
    #recordPopup {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        display: none;
        justify-content: center;
        align-items: center;
    }
    #recordBox {
        background: #fff;
        color: #000;
        padding: 20px 30px;
        border-radius: 10px;
        text-align: center;
        font-size: 20px;
        min-width: 250px;
    }
    #recordBox button {
        margin-top: 15px;
        padding: 8px 20px;
        font-size: 16px;
        background: #333;
        color: #fff;
        border: none;
        cursor: pointer;
    }
    #recordBox button:hover {
        background: #555;
    }

    /* === AKTUÁLIS INFO BOX === */
    #infoBox {
        margin-top: 10px;
        padding: 10px 15px;
        background: #222;
        color: #aaa;
        border: 1px solid #555;
        border-radius: 5px;
        font-size: 14px;
        min-height: 60px;
        display: block;
        visibility: hidden;
    }
    #infoBox.active {
        display: block;
        visibility: visible;
    }
    #infoBox p {
        margin: 3px 0;
    }
</style>
</head>
<body>

<h1>meRGB</h1>

<div class="menu">
    <label style="color:#ccc; font-size:14px;">
        <input type="checkbox" id="timeModeChk">Időmód
    </label>
    <button id="easyBtn" onclick="startGame('easy')">Könnyű</button>
    <button id="mediumBtn" onclick="startGame('medium')">Közepes</button>
    <button id="hardBtn" onclick="startGame('hard')">Nehéz</button>
    <button onclick="resetRecords()">Rekordok törlése</button>
</div>

<p>Pont: <span id="score">0</span></p>

<div id="infoBox"></div>

<div style="position: relative; display: inline-block;">
    <canvas id="game"></canvas>
    <div id="gameover">Vége a játéknak!</div>
</div>

<!-- === REKORD POPUP === -->
<div id="recordPopup">
    <div id="recordBox">
        <div id="recordText"></div>
        <button onclick="closeRecordPopup()">OK</button>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const gameOverEl = document.getElementById('gameover');

let COLS = 2;
let ROWS = 2;
let CELL = 40;

let WHITE_LIFE = 99;
let MERGED_LIFE = 99;
let SIMPLE_SWAP = 0;
let DIST_PENALTY = 0;
let PRIMARY_MERGE = 0;
let SECONDARY_MERGE = 0;
let LIFE_CYCLE_MS = 1000;

let score = 1;

let lastWhiteExplosionValue = 0;

let timeMode = false;
let timeModeActive = false;
let timeInterval = null;
let microTick = 0;

let grid = [];
let whiteLife = [];
let mergedLife = [];
let selected = null;
let hoverInfo = null;
let difficulty = "base";
let help = true;

const BASE = [1,2,4];
const missing = { 3:4, 5:2, 6:1 };

function updateHelp() {
    if (difficulty === "easy" || difficulty === "base") {
        help = true;
        return;
    }
    if (difficulty === "hard") {
        help = false;
        return;
    }
    // Medium: help visible only until the board is about half empty
    const total = ROWS * COLS;
    let filled = 0;
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (grid[r][c] !== 0) filled++;
        }
    }
    help = filled > total / 2;
}

function getRecordKey(level) {
    return "mergb_record_" + level + (timeModeActive ? "_time" : "");
}

function setCookie(name, value, days) {
    const expires = new Date(Date.now() + days*24*60*60*1000).toUTCString();
    document.cookie = `${name}=${value}; expires=${expires}; path=/`;
}

function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^|; )' + name + '=([^;]+)'));
    return match ? match[2] : null;
}

function deleteCookie(name) {
    document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/`;
}

function loadRecord(level) {
    const key = getRecordKey(level);
    const fromLS = localStorage.getItem(key);
    if (fromLS !== null) return parseInt(fromLS, 10) || 0;
    const fromCookie = getCookie(key);
    return parseInt(fromCookie, 10) || 0;
}

function saveRecord(level, value) {
    const key = getRecordKey(level);
    localStorage.setItem(key, value);
    setCookie(key, value, 365);
}

function resetRecords() {
    ["easy", "medium", "hard"].forEach(level => {
        const key1 = "mergb_record_" + level;
        const key2 = "mergb_record_" + level + "_time";
        localStorage.removeItem(key1);
        localStorage.removeItem(key2);
        deleteCookie(key1);
        deleteCookie(key2);
    });
    updateButtons();
}

function updateButtons() {
    document.getElementById('easyBtn').innerHTML =
        `Könnyű (${loadRecord('easy')} / ${loadRecord('easy_time')})`;
    document.getElementById('mediumBtn').innerHTML =
        `Közepes (${loadRecord('medium')} / ${loadRecord('medium_time')})`;
    document.getElementById('hardBtn').innerHTML =
        `Nehéz (${loadRecord('hard')} / ${loadRecord('hard_time')})`;
}

function showRecordPopup(newScore, oldRecord) {
    document.getElementById("recordText").innerHTML =
        `<b>ÚJ REKORD!</b><br><br>Pont: ${newScore}<br>Előző rekord: ${oldRecord}`;
    document.getElementById("recordPopup").style.display = "flex";
}

function closeRecordPopup() {
    document.getElementById("recordPopup").style.display = "none";
}

function startGame(level) {
    difficulty = level;
    if (level === "easy") {
        COLS = 6; ROWS = 6;
        WHITE_LIFE = 24;
        SIMPLE_SWAP = -3;
        DIST_PENALTY = 1;
        PRIMARY_MERGE = -2;
        SECONDARY_MERGE = -1;
        MERGED_LIFE = 15;
        LIFE_CYCLE_MS = 10000;
        score = 50;
    }
    else if (level === "medium") {
        COLS = 7; ROWS = 9;
        WHITE_LIFE = 36;
        SIMPLE_SWAP = -5;
        DIST_PENALTY = 1.5;
        PRIMARY_MERGE = -3;
        SECONDARY_MERGE = -2;
        MERGED_LIFE = 10;
        LIFE_CYCLE_MS = 8000;
        score = 100;
    }
    else if (level === "hard") {
        COLS = 9; ROWS = 12;
        WHITE_LIFE = 48;
        SIMPLE_SWAP = -7;
        DIST_PENALTY = 2;
        PRIMARY_MERGE = -4;
        SECONDARY_MERGE = -3;
        MERGED_LIFE = 5;
        LIFE_CYCLE_MS = 5000;
        score = 80;
    }

    // Dinamikus CELL méretezés mobilhoz
    CELL = Math.max(20, Math.min(60, Math.floor(window.innerWidth / COLS)));

    canvas.width = COLS * CELL;
    canvas.height = ROWS * CELL;

    initGrid();
    selected = null;
    hoverInfo = null;
    gameOverEl.style.display = "none";

    scoreEl.textContent = Math.round(score);

    if (timeInterval) {
        clearInterval(timeInterval);
        timeInterval = null;
        microTick = 0;
    }

    timeMode = document.getElementById("timeModeChk").checked;
    timeModeActive = timeMode;

    if (timeMode) {
        startTimeDecay();
    }

    draw();
}

function startTimeDecay() {
    timeInterval = setInterval(() => {
        timeTick();
    }, LIFE_CYCLE_MS / 10);
}

function timeTick() {
    
    let changed = false;

    if(microTick == 9) {
        // 1) Fehérek öregítése
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (grid[r][c] === 7 && whiteLife[r][c] > 0) {
                    whiteLife[r][c]--;
                    if (whiteLife[r][c] === 0) {
                        grid[r][c] = 0;
                        changed = true;
                    }
                }
            }
        }
        // 2) Másodlagosak öregítése + bomlás
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const val = grid[r][c];
                if ((val === 3 || val === 5 || val === 6) && mergedLife[r][c] > 0) {
                    mergedLife[r][c]--;
                    if (mergedLife[r][c] === 0) {
                        dissolveOne(r, c, val);
                        changed = true;
                    }
                }
            }
        }

        // 3) Ha bármi változott → gravitáció + balra-záródás + újrarajzolás
        if (changed) {
            applyGravity();
            collapseColumns();
        }
        score += SIMPLE_SWAP; // időalapú pontlevonás 
    }

    microTick++;
    if(microTick > 9) microTick = 0;
    scoreEl.textContent = Math.round(score);
    // === GAME OVER ELLENŐRZÉS ===
    if (score <= 0 || (noMovesLeft() && !hasWhite())) {
        endGame();
        return; // fontos, hogy ne fusson tovább
    }
    draw();
}

function dissolveOne(r, c, val) {
    score += PRIMARY_MERGE; // pontlevonás a PRIMARY_MERGE alapján

    const color1 = (val === 3 ? 1 : val === 5 ? 1 : 2);
    const color2 = (val === 3 ? 2 : val === 5 ? 4 : 4);

    grid[r][c] = color1;
    mergedLife[r][c] = 0;
    whiteLife[r][c] = 0;

    const dirs = [
        { dr: -1, dc: 1 }, { dr: -1, dc: 0 }, { dr: 0, dc: 1 },
        { dr: 1, dc: -1 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }
    ];

    for (const d of dirs) {
        const nr = r + d.dr;
        const nc = c + d.dc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === 0) {
            grid[nr][nc] = color2;
            return;
        }
    }

    // ha nincs közeli üres → BFS
    let queue = [{ r, c }];
    let visited = new Set([`${r},${c}`]);

    while (queue.length > 0) {
        const { r: qr, c: qc } = queue.shift();
        for (const d of dirs) {
            const nr = qr + d.dr;
            const nc = qc + d.dc;
            const key = `${nr},${nc}`;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !visited.has(key)) {
                visited.add(key);
                if (grid[nr][nc] === 0) {
                    grid[nr][nc] = color2;
                    return;
                }
                queue.push({ r: nr, c: nc });
            }
        }
    }
}

function initGrid() {
    const total = COLS * ROWS;
    const each = Math.floor(total / 3);

    let pool = [];
    for (let i=0; i<each; i++) pool.push(1);
    for (let i=0; i<each; i++) pool.push(2);
    for (let i=0; i<each; i++) pool.push(4);

    while (pool.length < total) pool.push(BASE[Math.floor(Math.random()*3)]);

    // Fisher–Yates shuffle
    for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
    }

    grid = [];
    whiteLife = [];
    mergedLife = [];

    let idx = 0;
    for (let r=0; r<ROWS; r++) {
        let row = [];
        let lifeRow = [];
        let mergeRow = [];
        for (let c=0; c<COLS; c++) {
            row.push(pool[idx++]);
            lifeRow.push(0);
            mergeRow.push(0);
        }
        grid.push(row);
        whiteLife.push(lifeRow);
        mergedLife.push(mergeRow);
    }
}

function colorFromMask(m, whiteLifeValue = WHITE_LIFE, mergedLifeValue = null) {
    if (m === 0) return "#000";

    // === KÖZÖS HÁTTÉRSZÜRKE ALAPSZINT ===
    const BG = 80;  // ugyanaz a minimum tónus, mint a fehérnél

    // === FEHÉR HALVÁNYODÁS ===
    if (m === 7) {
        const t = Math.max(0, Math.min(1, whiteLifeValue / WHITE_LIFE));
        const g = Math.floor(BG + t * (255 - BG));
        return `rgb(${g},${g},${g})`;
    }

    // === ALAPSZÍNEK (R, G, B) ===
    let r = (m & 1) ? 255 : 0;
    let g = (m & 2) ? 180 : 0;
    let b = (m & 4) ? 255 : 0;

    // === MÁSODLAGOS HALVÁNYODÁS (3, 5, 6) ===
    if (mergedLifeValue !== null) {
        const t = Math.max(0, Math.min(1, mergedLifeValue / MERGED_LIFE));

        // háttérszürke felé halványítás (ugyanaz a logika, mint a fehérnél)
        r = Math.floor(BG + (r - BG) * t);
        g = Math.floor(BG + (g - BG) * t);
        b = Math.floor(BG + (b - BG) * t);
    }

    return `rgb(${r},${g},${b})`;
}

function getBorderColor() {
    const t = microTick / 9; // 0.0 → 1.0

    const r = Math.floor(80 + t * (255 - 80)); // 80 → 255
    const g = Math.floor(80 * (1 - t));        // 80 → 0
    const b = Math.floor(80 * (1 - t));        // 80 → 0

    return `rgb(${r},${g},${b})`;
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    updateHelp();

    for (let r=0; r<ROWS; r++) {
        for (let c=0; c<COLS; c++) {
            
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            
            const x = c*CELL;
            const y = r*CELL;
            const val = grid[r][c];

            ctx.fillStyle = "#333";
            ctx.fillRect(x,y,CELL,CELL);

            if (val!==0) {
                const life = (val===7 ? whiteLife[r][c] : WHITE_LIFE);
                const ml = (val === 3 || val === 5 || val === 6) ? mergedLife[r][c] : null;
                ctx.fillStyle = colorFromMask(val, life, ml);
                // 3D-hatás: árnyék
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;

                ctx.beginPath();
                const cp = 0.12;
                ctx.roundRect(x + CELL*cp, y + CELL*cp, CELL*(1-2*cp), CELL*(1-2*cp), CELL*cp*2);
                ctx.fill();

                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                if (help && (val===3 || val===5 || val===6)) {
                    ctx.fillStyle = colorFromMask(missing[val]);
                    const cornerSize = CELL * 0.15;
                    const pad = CELL * 0.1;
                    const corners = [
                        {x: x + pad, y: y + pad},
                        {x: x + CELL - cornerSize - pad, y: y + pad},
                        {x: x + pad, y: y + CELL - cornerSize - pad},
                        {x: x + CELL - cornerSize - pad, y: y + CELL - cornerSize - pad}
                    ];
                    for (const pos of corners) {
                        ctx.beginPath();
                        ctx.roundRect(pos.x, pos.y, cornerSize, cornerSize, cornerSize * 0.2);
                        ctx.fill();
                    }
                }

                if (help && val === 7) {
                    drawCenterCircleText(x, y, whiteLife[r][c]);
                }

                if (help && (val === 3 || val === 5 || val === 6)) {
                drawCenterCircleText(x, y, mergedLife[r][c]);
                }
            }

            ctx.strokeStyle = (selected && selected.row===r && selected.col===c) ? "#ff0" : "#555";
            ctx.lineWidth = 2 ;
            ctx.strokeRect(x+2,y+2,CELL-4,CELL-4);
        }
    }

    ctx.strokeStyle = getBorderColor();
    ctx.lineWidth = 4;
    ctx.strokeRect(0, 0, canvas.width, canvas.height);

    // === TOOLTIP ===
    if (hoverInfo) {
        return; // Ha van infó, azt a külön info box mutatja, így nem rajzolunk plusz tooltipet a vászonra
        let textLines = [];
        const { x, y, isAction } = hoverInfo;

        if (isAction) {
            // Várható érték tooltip (merge/swap)
            const { expectedValue, moveType, dist } = hoverInfo;
            textLines = [
                `Típus: ${moveType}`,
                `Távolság: ${dist}`,
                `Érték: ${expectedValue > 0 ? '+' : ''}${expectedValue}`
            ];
        } else {
            // Fehér robbanás tooltip
            const { value, size, sumLife, mult } = hoverInfo;
            textLines = [
                `Érték: ${value}`,
                `Méret: ${size}`,
                `Szorzó: ×${mult}`/*,
                `Életösszeg: ${sumLife}`*/
            ];
        }

        ctx.font = "13px sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";

        const padding = 6;
        const lineHeight = 16;
        const width = 150;
        const height = textLines.length * lineHeight + padding*2;

        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(x, y - height - 10, width, height);

        ctx.fillStyle = "#fff";
        for (let i=0; i<textLines.length; i++) {
            ctx.fillText(textLines[i], x + padding, y - height - 10 + padding + i*lineHeight);
        }
    }

}

function drawCenterCircleText(x, y, text) {
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(x + CELL/2, y + CELL/2, CELL * 0.15, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.font = "10px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, x + CELL/2, y + CELL/2);
}

function getCell(x,y) {
    const col = Math.floor(x/CELL);
    const row = Math.floor(y/CELL);
    if (col<0||col>=COLS||row<0||row>=ROWS) return null;
    return {row,col};
}

function canMerge(a,b) {
    if (a===0 || b===0) return false;
    if (a===7 || b===7) return false;
    const merged = a|b;
    return merged!==a && merged!==b;
}

function doMerge(r1,c1,r2,c2) {
    const a = grid[r1][c1];
    const b = grid[r2][c2];
    const merged = a|b;

    grid[r2][c2] = merged;
    grid[r1][c1] = 0;

    whiteLife[r1][c1] = 0;
    whiteLife[r2][c2] = (merged===7 ? WHITE_LIFE : 0);

    // Merged (first-merge) life inicializálása
    mergedLife[r1][c1] = 0;
    if (merged === 3 || merged === 5 || merged === 6) {
        mergedLife[r2][c2] = MERGED_LIFE;
    } else {
        mergedLife[r2][c2] = 0;
    }

    const mergeValue = (merged===7 ? SECONDARY_MERGE : PRIMARY_MERGE);
    const dist = Math.abs(r1-r2) + Math.abs(c1-c2);
    score += mergeValue * dist * DIST_PENALTY;

    applyGravity();
    collapseColumns();
}

function applySwapPenalty(r1,c1,r2,c2) {
    const dist = Math.abs(r1-r2) + Math.abs(c1-c2);
    score += SIMPLE_SWAP * dist * DIST_PENALTY;
}

function applyGravity() {
    for (let c=0; c<COLS; c++) {
        let stack = [];
        let lifeStack = [];
        for (let r=ROWS-1; r>=0; r--) {
            if (grid[r][c]!==0) {
                stack.push(grid[r][c]);
                lifeStack.push(whiteLife[r][c]);
            }
        }
        for (let r=ROWS-1; r>=0; r--) {
            if (stack.length>0) {
                grid[r][c] = stack.shift();
                whiteLife[r][c] = lifeStack.shift();
            } else {
                grid[r][c] = 0;
                whiteLife[r][c] = 0;
            }
        }
    }
}

function collapseColumns() {
    let newCols = [];
    let newLifeCols = [];
    let newMergeCols = [];

    for (let c = 0; c < COLS; c++) {
        let empty = true;
        for (let r = 0; r < ROWS; r++) {
            if (grid[r][c] !== 0) { empty = false; break; }
        }
        if (!empty) {
            let col = [];
            let lifeCol = [];
            let mergeCol = [];
            for (let r = 0; r < ROWS; r++) {
                col.push(grid[r][c]);
                lifeCol.push(whiteLife[r][c]);
                mergeCol.push(mergedLife[r][c]);
            }
            newCols.push(col);
            newLifeCols.push(lifeCol);
            newMergeCols.push(mergeCol);
        }
    }

    while (newCols.length < COLS) {
        newCols.push(new Array(ROWS).fill(0));
        newLifeCols.push(new Array(ROWS).fill(0));
        newMergeCols.push(new Array(ROWS).fill(0));
    }

    for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS; r++) {
            grid[r][c] = newCols[c][r];
            whiteLife[r][c] = newLifeCols[c][r];
            mergedLife[r][c] = newMergeCols[c][r];
        }
    }
}

function fadeWhites() {
    let changed = false;

    for (let r=0; r<ROWS; r++) {
        for (let c=0; c<COLS; c++) {
            if (grid[r][c] === 7) {
                whiteLife[r][c]--;
                if (whiteLife[r][c] <= 0) {
                    grid[r][c] = 0;
                    whiteLife[r][c] = 0;
                    mergedLife[r][c] = 0;
                    changed = true;
                }
            }
        }
    }

    if (changed) {
        applyGravity();
        collapseColumns();
    }
}

function dissolveMerged() {
    let dissolved = [];

    // 1) Életciklus csökkentése és azonnali szétesés jelölése
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {

            const val = grid[r][c];

            // Csak másodlagos színek
            if (val === 3 || val === 5 || val === 6) {

                if (mergedLife[r][c] > 1) {
                    // Még ketyeg az élet
                    mergedLife[r][c]--;

                } else if (mergedLife[r][c] === 1) {
                    // *** MOST kell szétesnie ***
                    dissolved.push({ r, c, val });
                    mergedLife[r][c] = 0;

                     // <<< PONTLEVONÁS ITT >>>
                    score += PRIMARY_MERGE;
                }
            }
        }
    }

    if (dissolved.length === 0) return;

    // 2) Szétesés végrehajtása
    for (const { r, c, val } of dissolved) {

        // A két alapszín meghatározása
        const color1 = (val === 3 ? 1 : val === 5 ? 1 : 2);
        const color2 = (val === 3 ? 2 : val === 5 ? 4 : 4);

        // Az eredeti helyre kerül az egyik
        grid[r][c] = color1;
        mergedLife[r][c] = 0;
        whiteLife[r][c] = 0;

        let placed = false;

        // Szomszédos irányok, ahol próbáljuk elhelyezni a második színt
        const dirs = [
            { dr: -1, dc: 1 }, // felfelé-jobbra
            { dr: -1, dc: 0 }, // felfelé
            { dr: 0, dc: 1 },  // jobbra
            { dr: 1, dc: -1 }, // lefelé-balra
            { dr: 1, dc: 0 },  // lefelé
            { dr: 0, dc: -1 }  // balra
        ];

        // 3) Közeli üres hely keresése
        for (const dir of dirs) {
            const nr = r + dir.dr;
            const nc = c + dir.dc;

            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === 0) {
                grid[nr][nc] = color2;
                mergedLife[nr][nc] = 0;
                whiteLife[nr][nc] = 0;
                placed = true;
                break;
            }
        }

        // 4) Ha nincs közeli üres, BFS-sel keresünk
        if (!placed) {
            let queue = [{ r, c, dist: 0 }];
            let visited = new Set([`${r},${c}`]);

            while (queue.length > 0 && !placed) {
                const { r: qr, c: qc, dist } = queue.shift();
                if (dist > 5) break;

                for (const dir of dirs) {
                    const nr = qr + dir.dr;
                    const nc = qc + dir.dc;
                    const key = `${nr},${nc}`;

                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !visited.has(key)) {
                        visited.add(key);

                        if (grid[nr][nc] === 0) {
                            grid[nr][nc] = color2;
                            mergedLife[nr][nc] = 0;
                            whiteLife[nr][nc] = 0;
                            placed = true;
                            break;
                        }

                        queue.push({ r: nr, c: nc, dist: dist + 1 });
                    }
                }
            }
        }
    }
}

function noMovesLeft() {
    for (let r1=0; r1<ROWS; r1++) {
        for (let c1=0; c1<COLS; c1++) {
            const a = grid[r1][c1];
            if (a===0 || a===7) continue;

            for (let dr=-1; dr<=1; dr++) {
                for (let dc=-1; dc<=1; dc++) {
                    if (dr===0 && dc===0) continue;
                    const r2 = r1+dr;
                    const c2 = c1+dc;
                    if (r2<0||r2>=ROWS||c2<0||c2>=COLS) continue;

                    const b = grid[r2][c2];
                    if (b===0 || b===7) continue;

                    if (canMerge(a,b)) return false;
                }
            }
        }
    }
    return true;
}

function hasWhite() {
    for (let r=0; r<ROWS; r++) {
        for (let c=0; c<COLS; c++) {
            if (grid[r][c] === 7) return true;
        }
    }
    return false;
}

function finalPenalty() {
    let penalty = 0;
    for (let r=0; r<ROWS; r++) {
        for (let c=0; c<COLS; c++) {
            const v = grid[r][c];
            if (v===1 || v===2 || v===4) penalty += 3;
            else if (v===3 || v===5 || v===6) penalty += 2;
            else if (v===7) penalty += 1;
        }
    }
    return penalty;
}

function isBoardEmpty() {
    for (let r=0; r<ROWS; r++) {
        for (let c=0; c<COLS; c++) {
            if (grid[r][c] !== 0) return false;
        }
    }
    return true;
}

function endGame() {

    if (timeInterval) {
        clearInterval(timeInterval);
        timeInterval = null;
    }

    const penalty = finalPenalty();
    score -= penalty;

    if (isBoardEmpty()) {
        score += lastWhiteExplosionValue * 2;
        if (timeMode) {
           score *= 2;
        }
    }

    const roundedScore = Math.round(score);
    scoreEl.textContent = roundedScore;
    gameOverEl.style.display = "block";

    const oldRecord = loadRecord(difficulty);
    if (roundedScore > oldRecord) {
        saveRecord(difficulty, roundedScore);
        showRecordPopup(roundedScore, oldRecord);
    }

    updateButtons();
}

function getWhiteCluster(row, col) {
    if (grid[row][col] !== 7) return null;

    let visited = Array.from({length:ROWS},()=>Array(COLS).fill(false));
    let group = [];

    function dfs(r,c) {
        if (r<0||r>=ROWS||c<0||c>=COLS) return;
        if (visited[r][c]) return;
        if (grid[r][c] !== 7) return;
        visited[r][c] = true;
        group.push({r,c});
        dfs(r+1,c);
        dfs(r-1,c);
        dfs(r,c+1);
        dfs(r,c-1);
    }

    dfs(row,col);
    return group;
}

function explodeWhiteAt(row, col) {
    const group = getWhiteCluster(row, col);
    if (!group) return;

    let sumLife = 0;
    for (let g of group) sumLife += whiteLife[g.r][g.c];

    let size = group.length;
    let mult = (size>=8 ? 4 : size>=5 ? 3 : size>=3 ? 2 : 1);
    let value = sumLife * mult;

    score += value;
    lastWhiteExplosionValue = value;

    for (let g of group) {
        grid[g.r][g.c] = 0;
        whiteLife[g.r][g.c] = 0;
        mergedLife[g.r][g.c] = 0;
    }

    applyGravity();
    collapseColumns();
    fadeWhites();
    dissolveMerged();
    applyGravity();
    collapseColumns();
    scoreEl.textContent = Math.round(score);

    if (score <= 0 || (noMovesLeft() && !hasWhite())) endGame();
}

function updateInfoBox(hoverInfo) {
    const infoBox = document.getElementById('infoBox');
    if (!hoverInfo) {
        infoBox.classList.remove('active');
        return;
    }

    let html = '';
    if (hoverInfo.isAction) {
        const { expectedValue, moveType, dist } = hoverInfo;
        html = `
            <p><strong>${moveType}</strong></p>
            <p>Távolság: ${dist}</p>
            <p>Érték: <span style="color: ${expectedValue > 0 ? '#0f0' : '#f44'}">${expectedValue > 0 ? '+' : ''}${expectedValue}</span></p>
        `;
    } else {
        const { value, size, sumLife, mult } = hoverInfo;
        html = `
            <p><strong>Fehér robbanás</strong></p>
            <p>Érték: ${value}</p>
            <p>Méret: ${size} (×${mult})</p>
            <!-- <p>Életösszeg: ${sumLife}</p> -->
        `;
    }

    infoBox.innerHTML = html;
    infoBox.classList.add('active');
}

canvas.addEventListener('mousemove', e=>{
    if (gameOverEl.style.display==="block") return;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const cell = getCell(x,y);
    if (!cell) { 
        hoverInfo = null; 
        updateInfoBox(null);
        draw(); 
        return; 
    }

    const {row, col} = cell;

    // === KIVÁLASZTOTT MEZZŐVEL – VÁRHATÓ ÉRTÉK ===
    if (selected && !(selected.row === row && selected.col === col)) {
        const r1 = selected.row;
        const c1 = selected.col;
        const r2 = row;
        const c2 = col;

        const a = grid[r1][c1];
        const b = grid[r2][c2];

        let expectedValue = 0;
        let moveType = "";

        if (canMerge(a,b)) {
            const merged = a|b;
            const mergeValue = (merged===7 ? SECONDARY_MERGE : PRIMARY_MERGE);
            const dist = Math.abs(r1-r2) + Math.abs(c1-c2);
            expectedValue = mergeValue * dist * DIST_PENALTY;
            moveType = (merged===7 ? "Fehér merge" : "Normál merge");
        } else if (a!==0 && b!==0) {
            const dist = Math.abs(r1-r2) + Math.abs(c1-c2);
            expectedValue = SIMPLE_SWAP * dist * DIST_PENALTY;
            moveType = "Csere";
        }

        hoverInfo = {
            x: col*CELL,
            y: row*CELL,
            expectedValue: Math.round(expectedValue),
            moveType: moveType,
            dist: Math.abs(r1-r2) + Math.abs(c1-c2),
            isAction: true
        };

        updateInfoBox(hoverInfo);
        draw();
        return;
    }

    // === FEHÉR SZIGET TOOLTIP ===
    if (grid[row][col] !== 7) {
        hoverInfo = null;
        updateInfoBox(null);
        draw();
        return;
    }

    const group = getWhiteCluster(row, col);
    if (!group) { 
        hoverInfo = null; 
        updateInfoBox(null);
        draw(); 
        return; 
    }

    let sumLife = 0;
    for (let g of group) sumLife += whiteLife[g.r][g.c];

    let size = group.length;
    let mult = (size>=8 ? 4 : size>=5 ? 3 : size>=3 ? 2 : 1);
    let value = sumLife * mult;

    hoverInfo = {
        x: col*CELL,
        y: row*CELL,
        sumLife,
        size,
        mult,
        value,
        isAction: false
    };

    updateInfoBox(hoverInfo);
    draw();
});

canvas.addEventListener('click', e=>{
    if (gameOverEl.style.display==="block") return;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const cell = getCell(x,y);
    if (!cell) return;

    if (!selected) {
        selected = cell;
    } else {
        const r1 = selected.row;
        const c1 = selected.col;
        const r2 = cell.row;
        const c2 = cell.col;

        const a = grid[r1][c1];
        const b = grid[r2][c2];

        if (r1===r2 && c1===c2) {
            selected=null;
        } else {
            if (canMerge(a,b)) {
                doMerge(r1,c1,r2,c2);
            } else {
                grid[r2][c2] = a;
                grid[r1][c1] = b;

                const lifeA = whiteLife[r1][c1];
                const lifeB = whiteLife[r2][c2];
                whiteLife[r2][c2] = lifeA;
                whiteLife[r1][c1] = lifeB;

                const mergedA = mergedLife[r1][c1];
                const mergedB = mergedLife[r2][c2];
                mergedLife[r2][c2] = mergedA;
                mergedLife[r1][c1] = mergedB;

                applySwapPenalty(r1, c1, r2, c2);
            }
            selected=null;
        }
    }

    fadeWhites();
    dissolveMerged();
    applyGravity();
    collapseColumns();
    scoreEl.textContent = Math.round(score);
    hoverInfo = null;
    updateInfoBox(null);
    draw();

    if (score <= 0 || (noMovesLeft() && !hasWhite())) endGame();
});

canvas.addEventListener('contextmenu', e=>{
    e.preventDefault();
    if (gameOverEl.style.display==="block") return;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const cell = getCell(x,y);
    if (!cell) return;

    explodeWhiteAt(cell.row, cell.col);
    hoverInfo = null;
    updateInfoBox(null);
    draw();
});

let touchStartX, touchStartY, touchStartTime;

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    touchStartTime = Date.now();
});

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (gameOverEl.style.display==="block") return;
    if (!selected) {
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();

        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const x = (touch.clientX - rect.left) * scaleX;
        const y = (touch.clientY - rect.top) * scaleY;

        const cell = getCell(x, y);

        if (!cell) {
            hoverInfo = null;
            updateInfoBox(null);
            return;
        }

        const {row, col} = cell;
        if (grid[row][col] === 7) {
            const group = getWhiteCluster(row, col);
            if (group) {
                let sumLife = 0;
                for (let g of group) sumLife += whiteLife[g.r][g.c];
                let size = group.length;
                let mult = (size>=8 ? 4 : size>=5 ? 3 : size>=3 ? 2 : 1);
                let value = sumLife * mult;
                hoverInfo = {x: col*CELL, y: row*CELL, sumLife, size, mult, value, isAction: false};
                updateInfoBox(hoverInfo);
            }
        }
    }
});

canvas.addEventListener('touchend', e => {
    e.preventDefault();
    const touch = e.changedTouches[0];

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    const x = (touch.clientX - rect.left) * scaleX;
    const y = (touch.clientY - rect.top) * scaleY;
    const cell = getCell(x, y);
    if (!cell) return;

    // swipe irány/távolság: EZ marad clientX/Y alapú
    const deltaX = touch.clientX - touchStartX;
    const deltaY = touch.clientY - touchStartY;
    const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
    const duration = Date.now() - touchStartTime;


    if (distance > 50) { // swipe
        let dirX = 0, dirY = 0;
        if (Math.abs(deltaX) > Math.abs(deltaY)) {
            dirX = deltaX > 0 ? 1 : -1;
        } else {
            dirY = deltaY > 0 ? 1 : -1;
        }
        const targetRow = cell.row + dirY;
        const targetCol = cell.col + dirX;
        if (targetRow >= 0 && targetRow < ROWS && targetCol >= 0 && targetCol < COLS) {
            const a = grid[cell.row][cell.col];
            const b = grid[targetRow][targetCol];
            console.log(`Swipe from (${cell.row},${cell.col}) to (${targetRow},${targetCol}) - values: ${a} → ${b}`);
            if (canMerge(a, b)) {
                doMerge(cell.row, cell.col, targetRow, targetCol);
            } else {
                grid[targetRow][targetCol] = a;
                grid[cell.row][cell.col] = b;
                const lifeA = whiteLife[cell.row][cell.col];
                const lifeB = whiteLife[targetRow][targetCol];
                whiteLife[targetRow][targetCol] = lifeA;
                whiteLife[cell.row][cell.col] = lifeB;
                const mergedA = mergedLife[cell.row][cell.col];
                const mergedB = mergedLife[targetRow][targetCol];
                mergedLife[targetRow][targetCol] = mergedA;
                mergedLife[cell.row][cell.col] = mergedB;
                applySwapPenalty(cell.row, cell.col, targetRow, targetCol);
            }
            fadeWhites();
            dissolveMerged();
            applyGravity();
            collapseColumns();
            scoreEl.textContent = Math.round(score);
            draw();
            if (score <= 0 || (noMovesLeft() && !hasWhite())) endGame();
        }
    } else if (duration > 500) { // hosszú érintés, robbantás
        explodeWhiteAt(cell.row, cell.col);
        hoverInfo = null;
        draw();
    } else { // rövid érintés, kiválaszt
        if (!selected) {
            selected = cell;
        } else {
            const r1 = selected.row;
            const c1 = selected.col;
            const r2 = cell.row;
            const c2 = cell.col;
            const a = grid[r1][c1];
            const b = grid[r2][c2];
            if (r1 === r2 && c1 === c2) {
                selected = null;
            } else {
                if (canMerge(a, b)) {
                    doMerge(r1, c1, r2, c2);
                } else {
                    grid[r2][c2] = a;
                    grid[r1][c1] = b;
                    const lifeA = whiteLife[r1][c1];
                    const lifeB = whiteLife[r2][c2];
                    whiteLife[r2][c2] = lifeA;
                    whiteLife[r1][c1] = lifeB;
                    const mergedA = mergedLife[r1][c1];
                    const mergedB = mergedLife[r2][c2];
                    mergedLife[r2][c2] = mergedA;
                    mergedLife[r1][c1] = mergedB;
                    applySwapPenalty(r1, c1, r2, c2);
                }
                selected = null;
            }
        }
        fadeWhites();
        dissolveMerged();
        applyGravity();
        collapseColumns();
        scoreEl.textContent = Math.round(score);
        hoverInfo = null;
        updateInfoBox(null);
        draw();
        if (score <= 0 || (noMovesLeft() && !hasWhite())) endGame();
    }
});


initGrid();
startGame("base");
//draw();
updateButtons();
</script>
